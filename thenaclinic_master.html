<title>더나클리닉 시술 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f7; --card:#ffffff; --ink:#13241f; --sub:#5c6c68; --mute:#98a6a2; --line:#e7edeb;
  --mint:#2bb3a0; --mint-d:#12897a; --mint-l:#e9f7f4; --mint-ll:#f4fbf9;
  --gold:#c4a05a; --gold-d:#9c7a37; --gold-l:#fbf5e8;
  --rose:#e0667a; --rose-l:#fdeff1; --green:#24996b; --green-l:#eaf7f0;
  --shadow:0 1px 2px rgba(19,36,31,.04),0 6px 18px rgba(19,36,31,.06);
  --radius:20px; --nav-h:68px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#e9eeec;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.jp{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}
.app{max-width:480px;margin:0 auto;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}

/* Header */
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;overflow:hidden;background:#666;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand h1{font-size:15px;font-weight:900;letter-spacing:-.3px;line-height:1.2}
.brand h1 span{font-size:10px;font-weight:500;color:var(--gold-d);background:var(--gold-l);border:1px solid #efe2c4;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}
.brand p{font-size:10.5px;color:var(--mute)}
.chip-score{display:flex;align-items:center;gap:5px;background:var(--gold-l);border:1px solid #efe2c4;color:var(--gold-d);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px}

/* Main */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 24px);scroll-behavior:smooth}
main::-webkit-scrollbar{display:none}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sec-t{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sec-t i{font-style:normal}
.h2{font-size:17px;font-weight:900;letter-spacing:-.4px}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}

/* Hero */
.hero{background:linear-gradient(135deg,#1aa391 0%,#36bfab 55%,#8fd9cb 100%);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(26,163,145,.25)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.hero .pill{display:inline-block;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.hero h2{font-size:19px;font-weight:900;margin-top:8px;letter-spacing:-.4px}
.hero p{font-size:12px;opacity:.9;margin-top:2px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px;text-align:center}
.hero-stats b{display:block;font-size:16px;font-weight:900}
.hero-stats span{font-size:10px;opacity:.9}

/* Today random */
.today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn-ghost{font-size:11.5px;font-weight:700;color:var(--mint-d);background:var(--mint-l);padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;transition:transform .15s}
.btn-ghost:active{transform:scale(.95)}
.today-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--mint-ll);border:1px solid #d8f0eb;transition:transform .15s}
.today-item:active{transform:scale(.98)}
.today-item+.today-item{margin-top:8px}
.today-item.done{background:#fff;border-color:var(--line)}
.check{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff;color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.today-item.done .check{background:var(--green-l);color:var(--green);border-color:#cdeedd}

/* Quick actions */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.qa button:active{transform:scale(.97)}
.qa .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.qa b{display:block;font-size:13.5px;font-weight:700}
.qa span{font-size:11px;color:var(--mute)}

/* Procedure card */
.search{position:relative}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px 0 38px;font-size:14px;outline:none;transition:border .2s}
.search input:focus{border-color:var(--mint)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.55}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;font-weight:500;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub);transition:all .2s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);transition:transform .15s;width:100%;text-align:left}
.pcard:active{transform:scale(.985)}
.pcard+.pcard{margin-top:10px}
.p-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.p-body{flex:1;min-width:0}
.p-name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-sub{font-size:11px;color:var(--mute);margin-top:1px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid}
.bar{height:5px;background:#eef2f1;border-radius:9px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#7fd6c8);border-radius:9px;transition:width .5s}
.star{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0;color:#cfd8d5;transition:transform .2s}
.star.on{color:var(--gold)}
.star:active{transform:scale(.85)}
.empty{text-align:center;padding:36px 16px;color:var(--mute);font-size:13px}
.empty .big{font-size:40px;margin-bottom:8px}

/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:12px}
.d-hero{position:relative}
.d-hero .top{display:flex;gap:12px;align-items:flex-start}
.d-hero h2{font-size:21px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
.d-sum{margin-top:12px;font-size:12.5px;color:var(--sub);background:var(--mint-ll);border:1px solid #dcf1ec;padding:11px 12px;border-radius:14px}
.keypoint{margin-top:10px;display:flex;gap:8px;align-items:flex-start;background:var(--gold-l);border:1px solid #efe2c4;border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:700;color:#6f5523}
.toc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:-16px;z-index:5;background:var(--bg);padding:8px 0;margin:-4px 0}
.toc::-webkit-scrollbar{display:none}
.toc button{flex-shrink:0;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub)}

/* Skin diagram */
.skin{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.layer{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11.5px;font-weight:700;color:#5b5145;transition:all .3s}
.layer small{font-weight:500;font-size:10.5px}
.layer.epidermis{height:34px;background:#f7e9dc}
.layer.dermis{height:52px;background:#f2d7cf}
.layer.fat{height:46px;background:#f8eec6}
.layer.smas{height:34px;background:#e6d7e4}
.layer.muscle{height:34px;background:#ecc9c4}
.layer.hit{box-shadow:inset 0 0 0 2px var(--mint);color:var(--mint-d)}
.layer.hit::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(43,179,160,.0) 0 14px,rgba(43,179,160,.18) 14px 18px);animation:wave 2.4s linear infinite}
@keyframes wave{to{background-position:72px 0}}
.layer .lbl{position:relative;z-index:1}
.layer .act{position:relative;z-index:1;background:var(--mint);color:#fff;font-size:10px;padding:2px 8px;border-radius:999px}
.layer .cool{position:relative;z-index:1;background:#e5f3ff;color:#2f6fb0;font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #c9e2fa}
.energy{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--mint-d);background:#fff;padding:8px;border-bottom:1px dashed var(--line)}
.flow{margin-top:12px;position:relative;padding-left:4px}
.flow-step{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:12px}
.flow-step:not(:last-child)::after{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:linear-gradient(var(--mint),#cdeee8)}
.flow-step .n{width:24px;height:24px;border-radius:50%;background:var(--mint);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 0 4px var(--mint-l)}
.flow-step p{font-size:12.5px;padding-top:2px}

/* Targets */
.tgt{border-radius:16px;padding:12px 13px}
.tgt+.tgt{margin-top:10px}
.tgt h4{font-size:12.5px;font-weight:900;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tgt ul{list-style:none}
.tgt li{font-size:12.5px;padding:4px 0 4px 16px;position:relative}
.tgt li::before{content:"";position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%}
.tgt.good{background:var(--green-l);border:1px solid #cdeedd;color:#18523b}
.tgt.good li::before{background:var(--green)}
.tgt.bad{background:var(--rose-l);border:1px solid #f6d1d7;color:#7a2533}
.tgt.bad li::before{background:var(--rose)}

/* Specs */
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--mint-ll);border:1px solid #e0f1ed;border-radius:14px;padding:10px 11px}
.spec.wide{grid-column:1/-1}
.spec span{font-size:10.5px;color:var(--mute);font-weight:500;display:block}
.spec b{font-size:12.5px;font-weight:700;display:block;margin-top:2px;line-height:1.4}
.pain{display:flex;gap:3px;margin-top:5px}
.pain i{width:16px;height:6px;border-radius:4px;background:#dbe5e2}
.pain i.on{background:linear-gradient(90deg,var(--gold),#e2bf7b)}

/* FAQ */
.faq{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.faq+.faq{margin-top:8px}
.faq summary{list-style:none;padding:13px 14px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary .q{color:var(--mint-d);font-weight:900}
.faq summary .arr{margin-left:auto;transition:transform .25s;color:var(--mute);font-size:12px}
.faq[open] summary .arr{transform:rotate(180deg)}
.faq .ans{padding:0 14px 14px;user-select:text;-webkit-user-select:text}
.ans-box{border-radius:12px;padding:10px 12px;font-size:12.5px;position:relative}
.ans-box+.ans-box{margin-top:8px}
.ans-box.kr{background:#f7f9f8;border:1px solid var(--line)}
.ans-box.jpbox{background:#fff8f2;border:1px solid #f4e2cf;color:#5b4632}
.ans-box .lang{font-size:10px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.copy{font-size:10.5px;font-weight:700;color:var(--mint-d);background:var(--mint-l);padding:3px 8px;border-radius:8px}
.tips li{list-style:none;font-size:12.5px;padding:8px 10px 8px 34px;position:relative;background:var(--gold-l);border:1px solid #f1e6cc;border-radius:12px;color:#5e4920}
.tips li+li{margin-top:6px}
.tips li::before{content:"💡";position:absolute;left:10px;top:8px}
.ac-rule{background:var(--rose-l);border:1px solid #f6d1d7;border-radius:14px;padding:11px 12px;color:#7a2533;margin-bottom:10px}
.ac-rule b{font-size:13px;font-weight:900;display:block}
.ac-rule p{font-size:11.5px;margin-top:3px;color:#8d4250}
.ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac-box{background:var(--mint-ll);border:1px solid #e0f1ed;border-radius:14px;padding:10px 11px}
.ac-box span{font-size:10.5px;color:var(--mute);font-weight:700;display:block}
.ac-box b{font-size:12px;font-weight:700;display:block;margin-top:3px;line-height:1.45}
.ac-sec{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}
.ac-sec h5{font-size:12.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.ac-sec p{font-size:12.5px;color:#3f4d4a}
.ac-react{display:flex;flex-direction:column;gap:6px}
.rx{padding:9px 10px;background:#f7f9f8;border-radius:12px;border-left:4px solid #cfe9e3}
.rx.l3{border-left-color:#e6c98a}.rx.l4{border-left-color:#ef9aa8}.rx.l5{border-left-color:var(--rose)}
.rx-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rx-top b{font-size:12.5px;font-weight:700}
.rx-lv{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--mint-l);color:var(--mint-d);white-space:nowrap}
.rx.l3 .rx-lv{background:var(--gold-l);color:var(--gold-d)}
.rx.l4 .rx-lv,.rx.l5 .rx-lv{background:var(--rose-l);color:var(--rose)}
.rx-bot{display:flex;align-items:center;gap:10px;margin-top:6px}
.rx-bot span{font-size:11.5px;color:var(--sub)}
.gauge{display:inline-flex;gap:3px;flex-shrink:0}
.gauge i{width:16px;height:7px;border-radius:4px;background:#dde5e3}
.gauge.g1 i.on,.gauge.g2 i.on{background:var(--mint)}
.gauge.g3 i.on{background:var(--gold)}
.gauge.g4 i.on,.gauge.g5 i.on{background:var(--rose)}
.rx-legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mute);margin:-1px 0 8px;flex-wrap:wrap}
.rx-legend .lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px}
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tl .ic{font-size:18px;line-height:1}
.tl span{display:block;font-size:10.5px;color:var(--mute);font-weight:700;margin-top:4px}
.tl b{display:block;font-size:13.5px;font-weight:900;margin-top:2px;line-height:1.3;letter-spacing:-.3px;word-break:keep-all}
.tl small{display:block;font-size:10px;color:var(--sub);margin-top:3px;line-height:1.35;word-break:keep-all}
.dt-row{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--gold-l);border:1px solid #efe2c4;border-radius:14px;padding:10px 12px}
.dt-row span{font-size:12px;font-weight:700;color:#6f5523}
.dt-stars{font-size:16px;letter-spacing:1px;color:var(--gold)}
.dt-stars em{font-style:normal;font-size:11px;font-weight:700;color:var(--gold-d);margin-left:6px;letter-spacing:0}
.p-meta{font-size:10.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta b{color:var(--gold);font-weight:400;letter-spacing:.5px}
.ac-moist{background:#f2f8ff;border-color:#d6e6fa}
.ac-sun{background:var(--gold-l);border-color:#efe2c4}
.ac-heat{background:#fff4ef;border-color:#f6d9cb}
.ac-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#eef2f1;color:var(--sub)}
.ac-badge.must{background:var(--rose);color:#fff}
.ac-list{list-style:none}
.ac-list li{font-size:12.5px;padding:4px 0 4px 18px;position:relative}
.ac-list li::before{content:"✓";position:absolute;left:2px;color:var(--mint-d);font-weight:900}
.ac-copy{margin-top:10px;width:100%;height:42px;border-radius:13px;background:var(--mint-l);color:var(--mint-d);font-weight:700;font-size:12.5px}
.off-badge{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--green-l);color:var(--green);border:1px solid #cdeedd}
.ac-badge.gen{background:#eef2f1;color:var(--mute);border:1px dashed #cfd8d5}
.bad-note{font-size:10.5px;color:#a0505f;margin-top:6px;line-height:1.45}
.p-off{font-size:9.5px;font-weight:700;color:var(--green);background:var(--green-l);border:1px solid #cdeedd;padding:1px 5px;border-radius:5px}
.disclaimer{font-size:10.5px;color:var(--mute);text-align:center;padding:4px 8px}

/* Detail action bar */
.dbar{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));padding:10px 16px;background:linear-gradient(transparent,var(--bg) 30%);display:none;gap:8px;z-index:15}
.dbar.on{display:flex}
.dbar .bm{width:52px;height:50px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:20px;color:#cfd8d5;box-shadow:var(--shadow)}
.dbar .bm.on{color:var(--gold);border-color:#efe2c4;background:var(--gold-l)}
.btn-main{flex:1;height:50px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(19,36,31,.22);transition:transform .15s}
.btn-main:active,.dbar .bm:active{transform:scale(.97)}
.btn-main .g{color:#f0cf8d}
.btn-mint{background:var(--mint);box-shadow:0 8px 20px rgba(43,179,160,.28)}
.btn-sub{flex:1;height:48px;border-radius:15px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px}

/* Bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10.5px;font-weight:700;height:100%;justify-content:center;transition:color .2s}
.nav button .ni{font-size:20px;line-height:1;filter:grayscale(1);opacity:.55;transition:all .2s}
.nav button.on{color:var(--mint-d)}
.nav button.on .ni{filter:none;opacity:1;transform:translateY(-1px)}
.nav .fab{position:relative}
.nav .fab .ni{width:52px;height:52px;margin-top:-26px;border-radius:18px;background:linear-gradient(140deg,var(--mint),var(--mint-d));display:grid;place-items:center;color:#fff;font-size:22px;filter:none;opacity:1;box-shadow:0 8px 20px rgba(18,137,122,.35);border:4px solid #fff}
.nav .fab{color:var(--mint-d)}

/* Bottom sheet */
.dim{position:absolute;inset:0;background:rgba(19,36,31,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:50;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:#d5dedb;margin:10px auto 4px;flex-shrink:0}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 10px;flex-shrink:0}
.sheet-hd h3{font-size:16px;font-weight:900;letter-spacing:-.3px}
.x{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:15px;color:var(--sub)}
.sheet-bd{overflow-y:auto;padding:0 16px 18px;overscroll-behavior:contain}

/* Quiz */
.qprog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qprog .track{flex:1;height:7px;background:#e3ebe8;border-radius:9px;overflow:hidden}
.qprog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:9px;transition:width .35s}
.qprog b{font-size:12px;color:var(--sub);white-space:nowrap}
.qbadges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qb{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px}
.qb.type{background:var(--ink);color:#fff}
.qb.proc{background:var(--mint-l);color:var(--mint-d)}
.qb.streak{background:var(--gold-l);color:var(--gold-d)}
.qtext{font-size:15.5px;font-weight:700;line-height:1.55;letter-spacing:-.2px}
.opts{margin-top:16px}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font-size:13.5px;font-weight:500;transition:all .18s}
.opt+.opt{margin-top:8px}
.opt:active{transform:scale(.985)}
.opt .no{width:24px;height:24px;border-radius:8px;background:#f0f4f3;display:grid;place-items:center;font-size:11.5px;font-weight:900;color:var(--sub);flex-shrink:0}
.opt.right{border-color:var(--green);background:var(--green-l);color:#18523b;font-weight:700}
.opt.right .no{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--rose);background:var(--rose-l);color:#7a2533}
.opt.wrong .no{background:var(--rose);color:#fff}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .opt{flex-direction:column;justify-content:center;height:110px;font-size:40px;font-weight:900;margin:0}
.ox .opt small{font-size:11px;font-weight:500;color:var(--mute)}
.ox .opt .no{display:none}
.fb{margin-top:14px;border-radius:16px;padding:13px 14px;font-size:12.5px;animation:fade .25s}
.fb.ok{background:var(--green-l);border:1px solid #cdeedd}
.fb.ng{background:var(--rose-l);border:1px solid #f6d1d7}
.fb h5{font-size:14px;font-weight:900;margin-bottom:4px}
.fb.ok h5{color:var(--green)}
.fb.ng h5{color:var(--rose)}
.fb p{color:#3f4d4a}
.pop{position:absolute;right:22px;top:70px;font-weight:900;color:var(--gold-d);font-size:16px;animation:pop 1s ease forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-24px)}}

/* Result */
.res{text-align:center;padding:8px 0}
.medal{width:84px;height:84px;margin:6px auto 12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f6dfa7,var(--gold));display:grid;place-items:center;font-size:40px;box-shadow:0 10px 26px rgba(196,160,90,.35)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.res-grid div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.res-grid span{font-size:10.5px;color:var(--mute)}
.res-grid b{display:block;font-size:18px;font-weight:900}

/* Launcher list */
.launch{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.launch+.launch{margin-top:8px}
.launch:active{transform:scale(.985)}
.launch .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.launch b{font-size:14px;display:block}
.launch span{font-size:11.5px;color:var(--mute)}
.launch .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:#f1f5f4;padding:3px 9px;border-radius:999px;white-space:nowrap}
.launch:disabled{opacity:.45}

/* Stats */
.rank-card{background:linear-gradient(135deg,#fffaf0,#fbf1db);border:1px solid #efe2c4;border-radius:22px;padding:18px;text-align:center}
.rank-card .r{font-size:19px;font-weight:900;color:#6f5523;margin-top:4px}
.rank-card .bar{height:8px;background:#f1e5c8;margin-top:12px}
.rank-card .bar i{background:linear-gradient(90deg,var(--gold),#e8c785)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-grid div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.mini-grid b{display:block;font-size:18px;font-weight:900}
.mini-grid span{font-size:10.5px;color:var(--mute)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0}
.prow+.prow{border-top:1px solid #f0f3f2}
.prow .nm{font-size:12.5px;font-weight:700;width:96px;flex-shrink:0}
.prow .bar{flex:1;margin:0;height:7px}
.prow .pc{font-size:11.5px;font-weight:700;color:var(--sub);width:38px;text-align:right}
.wrong-item{font-size:12.5px;padding:10px 12px;background:var(--rose-l);border:1px solid #f6d1d7;border-radius:12px;color:#7a2533}
.wrong-item+.wrong-item{margin-top:6px}
.wrong-item small{display:block;font-size:10.5px;color:#b0606d;font-weight:700;margin-bottom:2px}
.btn-danger{width:100%;height:44px;border-radius:14px;background:#fff;border:1px solid #f1c9d0;color:var(--rose);font-weight:700;font-size:12.5px}

/* Toast */
.toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 76px);transform:translate(-50%,20px);background:rgba(19,36,31,.92);color:#fff;font-size:12.5px;font-weight:500;padding:10px 16px;border-radius:999px;opacity:0;transition:all .25s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

'filorga':{

  summary:'피부 노화의 핵심 키를 쥐고 있는 \'섬유아세포\'의 기능을 되살리기 위해, 히알루론산과 53가지의 유효 성분(비타민, 아미노산, 미네랄 등)을 피부에 직접 공급하는 \'토탈 안티에이징 스킨부스터\'예요. 피부 세포가 살아나는 데 필요한 최적의 영양 환경을 만들어, 스스로 건강하고 빛나는 피부를 만들도록 도와줘요. 마치 지친 피부에 고농축 영양 칵테일을 공급하듯, 광채, 탄력, 수분, 피부톤 등 복합적인 피부 고민을 한 번에 개선해요.',

    {q:'영양 성분이 많다는데, 트러블 피부에도 괜찮을까요?', a:'네, 오히려 트러블성 피부에 도움이 될 수 있어요. NCTF 135HA에 포함된 비타민, 미네랄, 아미노산 등은 피부의 유수분 밸런스를 맞춰주고, 손상된 피부의 재생을 도와 피부 장벽을 튼튼하게 만들어요. 건강한 피부 환경이 조성되면 트러블 발생 빈도가 줄어들고, 염증 후 색소침착 개선에도 도움을 줄 수 있어요.'}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return Math.abs(h); }
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }

const RANKS = [
  {min:0, n:'초보 코디네이터 🌱'},
  {min:100, n:'성장 중인 상담원 🌿'},
  {min:250, n:'숙련된 피부 상담원 ⭐'},
  {min:450, n:'마스터 코디네이터 🏆'},
  {min:700, n:'더나 피부 마스터 👑'}
];
function rankInfo(score){
  let idx = 0; RANKS.forEach((r,i)=>{ if(score>=r.min) idx=i; });
  const cur = RANKS[idx], next = RANKS[idx+1];
  const pct = next ? Math.round((score-cur.min)/(next.min-cur.min)*100) : 100;
  return {name:cur.n, next, pct};
}
function procMastery(pid){
  const qs = QUIZ.filter(q=>q.pid===pid);
  const ok = qs.filter(q=>S.qstats[q.id] && S.qstats[q.id].last===true).length;
  return Math.round(ok/qs.length*100);
}
function overall(){
  let a=0,c=0; Object.values(S.qstats).forEach(s=>{a+=s.a;c+=s.c;});
  const mastered = QUIZ.filter(q=>S.qstats[q.id] && S.qstats[q.id].last===true).length;
  return {attempts:a, correct:c, acc: a? Math.round(c/a*100):null, mastery: Math.round(mastered/QUIZ.length*100), solved:Object.keys(S.qstats).length};
}

  currentView = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));

  document.querySelectorAll('.nav [data-nav]').forEach(b=>{

  ${a.sun?`<div class="ac-sec ac-sun"><h5>☀️ 자외선 차단 ${badge(a.sun.lv,'필수','권장')} ${genTag(a.sun)}</h5><p>${a.sun.t}</p></div>`:''}
  ${a.heat?`<div class="ac-sec ac-heat"><h5>🔥 열 자극 관리 ${badge(a.heat.lv,'집중 관리 필요','일반 주의')}</h5><p>${a.heat.t}</p></div>`:''}
  ${(a.extra&&a.extra.length)?`<div class="ac-sec"><h5>✅ 추가 주의사항</h5><ul class="ac-list">${a.extra.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  <button class="ac-copy" onclick="copyAftercare('${p.id}')">📋 고객 안내 문구 복사</button>`;
}
function copyAftercare(id){
  const p = P(id), a = p.aftercare || {}, t0 = p.timeline, rule = a.rule || COMMON_RULE;
  const nt = x => x ? ` (${x})` : '';
  const lines = [`[${p.name} 시술 후 주의사항]`];
  if(t0) lines.push(`■ 시술 시간: ${t0.time}${nt(t0.timeNote)}`, `■ 회복 기간: ${t0.rec}${nt(t0.recNote)}`, `■ ${t0.keepLabel||'유지 기간'}: ${t0.keep}${nt(t0.keepNote)}`);
  lines.push(`■ ${rule.title}`);
  if(a.wash) lines.push(`■ 세안·샤워: ${a.wash}`);
  if(a.makeup) lines.push(`■ 화장·제품: ${a.makeup}`);
  if(a.reactions) lines.push(`■ 일시적 반응: ${a.reactions.map(r=>`${r[0]} ${'●'.repeat(r[2])}${'○'.repeat(5-r[2])} (${r[1]})`).join(', ')}`);
  if(a.moisture) lines.push(`■ 보습·재생: ${acText(a.moisture)}`);
  if(a.sun) lines.push(`■ 자외선 차단(${a.sun.lv==='must'?'필수':'권장'}): ${a.sun.t}`);
  if(a.heat) lines.push(`■ 열 자극 관리: ${a.heat.t}`);
  (a.extra||[]).forEach(x=>lines.push(`- ${x}`));
  lines.push('이상 반응이 있으면 언제든 병원으로 연락 주세요.');
  const t = lines.join('\n');
  const done = () => { toast('📋 주의사항 안내 문구를 복사했어요'); vibrate(10); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done)); }
  else fallbackCopy(t,done);
}
function syncDbar(){
  const on = S.bookmarks.includes(activeId);
  const b = $('dbarBm'); b.classList.toggle('on', on); b.textContent = on ? '★' : '☆';
  const n = QUIZ.filter(q=>q.pid===activeId).length;
  $('dbarLabel').textContent = `${P(activeId).name} 퀴즈 풀기 (${n}문항)`;
}
function jump(id){
  const el = $(id); if(!el) return;
  $('main').scrollTo({top: el.offsetTop - 60, behavior:'smooth'});
}
function copyText(btn){
  const t = decodeURIComponent(btn.dataset.t);
  const done = () => { toast('📋 스크립트를 복사했어요'); vibrate(10); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  } else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('복사에 실패했어요'); }
  ta.remove();
}

let quiz = null;
function startQuiz(mode, pid){
  let list = [], label = '';
  if(mode==='proc'){ list = QUIZ.filter(q=>q.pid===pid); label = P(pid).name + ' 단원 퀴즈'; }
  else if(mode==='all'){ list = shuffle(QUIZ).slice(0,10); label = '전체 랜덤 퀴즈'; }
  else if(mode==='today'){ const ids = todayPicks(); list = QUIZ.filter(q=>ids.includes(q.pid)); label = '오늘의 랜덤 복습'; }
  else if(mode==='bookmark'){ list = QUIZ.filter(q=>S.bookmarks.includes(q.pid)); label = '북마크 퀴즈';
    if(!list.length){ toast('⭐ 먼저 시술을 북마크해 주세요'); return; } }
  else if(mode==='wrong'){ list = QUIZ.filter(q=>S.wrong.includes(q.id)); label = '오답 노트';
    if(!list.length){ toast('🎉 틀린 문제가 없어요!'); return; } }
  if(!list.length){ toast('출제할 문제가 없어요'); return; }
  list = shuffle(list).map(q=>{
    if(q.type==='ox') return {...q, order:[0,1]};
    return {...q, order: shuffle(q.o.map((_,i)=>i))};
  });
  quiz = {mode, pid, label, list, idx:0, correct:0, gained:0, streak:0, answered:false, wrongIds:[]};
  renderQuestion();
}

function renderQuestion(){
  const q = quiz.list[quiz.idx];
  const total = quiz.list.length;
  const pct = Math.round(quiz.idx/total*100);
  let opts;
  if(q.type==='ox'){
    opts = `<div class="ox">
      <button class="opt" data-i="0" onclick="answer(0)"><span class="no"></span>⭕<small>맞다</small></button>
      <button class="opt" data-i="1" onclick="answer(1)"><span class="no"></span>❌<small>틀리다</small></button>
    </div>`;
  } else {
    opts = q.order.map((oi,n)=>`<button class="opt" data-i="${oi}" onclick="answer(${oi})"><span class="no">${n+1}</span><span>${q.o[oi]}</span></button>`).join('');
  }
  openSheet(quiz.label, `
    <div class="qprog"><div class="track"><i style="width:${pct}%"></i></div><b>${quiz.idx+1} / ${total}</b></div>
    <div class="qbadges">
      <span class="qb type">${q.type==='ox'?'OX 퀴즈':'객관식'}</span>
      <span class="qb proc">${P(q.pid).emoji} ${P(q.pid).name}</span>
      ${quiz.streak>=2?`<span class="qb streak">🔥 ${quiz.streak}연속 정답 중</span>`:''}
    </div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${opts}</div>
    <div id="fbArea"></div>
  `);
}

function answer(choice){
  if(!quiz || quiz.answered) return;
  quiz.answered = true;
  const q = quiz.list[quiz.idx];
  const ok = choice === q.a;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    const i = +b.dataset.i;
    if(i===q.a) b.classList.add('right');
    else if(i===choice) b.classList.add('wrong');
  });
  const st = S.qstats[q.id] || {a:0,c:0,last:false};
  st.a++; if(ok) st.c++; st.last = ok; S.qstats[q.id] = st;

  let gain = 0;
  if(ok){
    quiz.streak++; quiz.correct++;
    gain = 10 + (quiz.streak>=3 ? 5 : 0);
    S.score += gain; quiz.gained += gain;
    S.bestStreak = Math.max(S.bestStreak, quiz.streak);
    S.wrong = S.wrong.filter(id=>id!==q.id);
    vibrate(20);
    const pop = document.createElement('div'); pop.className='pop'; pop.textContent = `+${gain}`;
    $('sheet').appendChild(pop); setTimeout(()=>pop.remove(),1000);
  } else {
    quiz.streak = 0;
    if(!S.wrong.includes(q.id)) S.wrong.push(q.id);
    quiz.wrongIds.push(q.id);
    vibrate([30,40,30]);
  }
  save();
  $('hdrScore').textContent = S.score;

  const rightLabel = q.type==='ox' ? (q.a===0?'O':'X') : `"${q.o[q.a]}"`;
  const last = quiz.idx === quiz.list.length-1;
  $('fbArea').innerHTML = `
    <div class="fb ${ok?'ok':'ng'}">
      <h5>${ok ? `✅ 정답입니다! +${gain}점${gain>10?' (콤보 보너스!)':''}` : `❗ 아쉬워요! 정답은 ${rightLabel}`}</h5>
      <p>${q.e}</p>
    </div>
    <button class="btn-main ${ok?'btn-mint':''}" style="width:100%;margin-top:12px" onclick="nextQ()">${last?'결과 보기 🏁':'다음 문제 →'}</button>
  `;
  setTimeout(()=>{ const b=$('sheetBody'); b.scrollTo({top:b.scrollHeight,behavior:'smooth'}); }, 60);
}

function nextQ(){
  quiz.idx++; quiz.answered = false;
  if(quiz.idx < quiz.list.length) renderQuestion();
  else renderResult();
}

function renderResult(){
  const total = quiz.list.length;
  const acc = Math.round(quiz.correct/total*100);
  const medal = acc===100 ? '👑' : acc>=70 ? '🏆' : acc>=40 ? '🌿' : '🌱';
  const msg = acc===100 ? '완벽해요! 이 파트는 마스터!' : acc>=70 ? '훌륭해요! 오답만 한 번 더 보면 완성!' : acc>=40 ? '좋은 시작이에요. 상세 페이지를 다시 훑어봐요.' : '괜찮아요! 학습 카드부터 차근차근 복습해요.';
  const r = rankInfo(S.score);
  const hasWrong = quiz.wrongIds.length > 0;
  const backTo = quiz.mode==='proc' ? `<button class="btn-sub" onclick="closeSheet();openDetail('${quiz.pid}')">시술 카드 다시 보기</button>` : `<button class="btn-sub" onclick="closeSheet();go('library')">시술 학습하기</button>`;
  openSheet('🏁 퀴즈 결과', `
    <div class="res">
      <div class="medal">${medal}</div>
      <h3 class="h2">${msg}</h3>
      <p class="muted" style="margin-top:4px">${quiz.label} · 현재 등급 ${r.name}</p>
      <div class="res-grid">
        <div><span>맞힌 문제</span><b style="color:var(--green)">${quiz.correct}/${total}</b></div>
        <div><span>정답률</span><b>${acc}%</b></div>
        <div><span>획득 점수</span><b style="color:var(--gold-d)">+${quiz.gained}</b></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${hasWrong?`<button class="btn-main" onclick="retryWrong()">📝 이번에 틀린 ${quiz.wrongIds.length}문제만 다시 풀기</button>`:''}
        <div style="display:flex;gap:8px">
          ${backTo}
          <button class="btn-sub" onclick="closeSheet()">닫기</button>
        </div>
      </div>
    </div>
  `);
}
function retryWrong(){
  const ids = quiz.wrongIds;
  const list = shuffle(QUIZ.filter(q=>ids.includes(q.id))).map(q=>({...q, order: q.type==='ox'?[0,1]:shuffle(q.o.map((_,i)=>i))}));
  quiz = {mode:'retry', pid:quiz.pid, label:'오답 재도전', list, idx:0, correct:0, gained:0, streak:0, answered:false, wrongIds:[]};
  renderQuestion();
}

/* 키보드/뒤로가기 지원 */
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('sheet').classList.contains('on')) closeSheet(); });

/* 시트 아래로 끌어 닫기 */
(function(){
  let y0=null; const sh=$('sheet');
  sh.addEventListener('touchstart',e=>{ if($('sheetBody').scrollTop<=0) y0=e.touches[0].clientY; else y0=null; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0===null) return; const dy=e.touches[0].clientY-y0; if(dy>0) sh.style.transform=`translateY(${dy}px)`; },{passive:true});
  sh.addEventListener('touchend',e=>{ if(y0===null) return; const dy=e.changedTouches[0].clientY-y0; sh.style.transform=''; if(dy>110) closeSheet(); y0=null; });
})();

/* 초기화 */
go('home');
</script>
</body>
</html>
